<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenchie's Midterm Portfolio - Contact</title>
</head>
<body>
    <center>
        <img src="assets/kenchie.jpg"
        alt="Kenchie"
        width="120"
        height="180">
        <header>
        <header>
            <h1>Kenchie's Midterm Portfolio</h1>
            <hr>
            <nav aria-label="Main navigation">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="media.html">Media</a>
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <hr>

        <main>
            <section>
                <h2>Contact Details</h2>
                <p>Contact Form</p>

                <form action="#" method="post">
                    <p>
                        <label for="full-name">Full Name </label><br>
                        <input type="text" id="full-name" name="full-name" placeholder="Enter your full name" required>
                    </p>

                    <p>
                        <label for="email">Email Address </label><br>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </p>

                    <p>
                        <label for="topic">Inquiry Topic </label><br>
                        <select id="topic" name="topic" required>
                            <option value="">-- Select Inquiry Type --</option>
                            <option value="services">Services</option>
                            <option value="project">Project Inquiry</option>
                            <option value="feedback">Feedback</option>
                            <option value="other">Other</option>
                        </select>
                    </p>

                    <p>
                        <label for="message">Message </label><br>
                        <textarea id="message" name="message" rows="5" cols="35" placeholder="Type your message here" required></textarea>
                    </p>

                    <p>
                        <button type="submit">Send Message</button>
                    </p>
                </form>
            </section>
        </main>


        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <br>
        <br>


        <hr>
        <footer>
            <p>© 2026 Kenchie | Human-Computer Interaction</p>
        </footer>
    </center>
</body>
</html>
